
name: Build PitchBlack Recovery - LXX525

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PBRP
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          repository: eleve1n/android_device_lava_LXX525-twrp
          ref: android-12.1
          path: device/lava/LXX525

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib \
            g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync ccache \
            bc libssl-dev libelf-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize PBRP
        run: |
          mkdir -p pbrp
          cd pbrp
          repo init --depth=1 \
            -u https://github.com/PitchBlackRecoveryProject/manifest_pb \
            -b android-12.1

      - name: Sync Sources
        run: |
          cd pbrp
          repo sync -c -j2 --force-sync \
            --no-clone-bundle --no-tags

      - name: Add Device Tree
        run: |
          mkdir -p pbrp/device/lava/LXX525
          cp -a device/lava/LXX525/. \
            pbrp/device/lava/LXX525/

      - name: Debug recovery directories
        run: |
         ls -la out/target/product/LXX525/ || true
         ls -la out/target/product/LXX525/root || true
         ls -la out/target/product/LXX525/ramdisk || true
         ls -la device/lava/LXX525/recovery/
         ls -la device/lava/LXX525/recovery/root/

      
      
      - name: Build Recovery
        run: |
          cd pbrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch pb_LXX525-eng

          echo "===== BUILD ENVIRONMENT ====="
          pwd
          echo "OUT_DIR=$OUT_DIR"
          echo "ANDROID_PRODUCT_OUT=$ANDROID_PRODUCT_OUT"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"

          echo "===== RECOVERY BUILD DIAGNOSTICS ====="

          for var in \
            BOARD_USES_RECOVERY_AS_BOOT \
            BOARD_BUILD_SYSTEM_ROOT_IMAGE \
            TARGET_ROOT_OUT \
            TARGET_RECOVERY_ROOT_OUT \
            INSTALLED_RAMDISK_TARGET \
            BUILDING_RECOVERY_IMAGE
          do
            echo "$var = $(get_build_var "$var")"
          done

          echo "===== OUTPUT DIRECTORIES ====="
          ls -lah out/target/product/LXX525/ || true

          echo "===== ROOT DIRECTORY CHECK ====="
          find out/target/product/LXX525 -maxdepth 2 \
            -type d \( -name root -o -name ramdisk -o -name recovery \) || true

          mka pbrp -j2
BUILD_STATUS=$?

echo "===== ROOT CONTENTS ====="
find out/target/product/LXX525/root -maxdepth 3 -ls 2>&1

echo "===== RAMDISK CONTENTS ====="
find out/target/product/LXX525/ramdisk -maxdepth 3 -ls 2>&1

echo "===== RECOVERY ROOT CONTENTS ====="
find out/target/product/LXX525/recovery/root -maxdepth 2 -ls 2>&1

exit $BUILD_STATUS

      - name: Upload Recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-LXX525
          path: |
            pbrp/out/target/product/LXX525/*.img
            pbrp/out/target/product/LXX525/*.zip
          if-no-files-found: error
          retention-days: 14
