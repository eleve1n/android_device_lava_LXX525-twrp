
name: OrangeFox LXX525 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync ccache \
            bc bzip2 lz4 pngcrush squashfs-tools \
            openjdk-17-jdk

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Checkout device tree
        run: |
          git clone \
            --depth=1 \
            -b android-12.1 \
            https://github.com/eleve1n/android_device_lava_LXX525-twrp.git \
            device/lava/LXX525

      - name: Check device configuration
        run: |
          cd device/lava/LXX525
          echo "Device tree files:"
          ls -la
          echo "Product configuration:"
          cat AndroidProducts.mk
          echo "Board configuration:"
          cat BoardConfig.mk
          echo "Prebuilt files:"
          find prebuilt -maxdepth 2 -type f -print

      - name: Report build status
        run: |
          echo "Device-tree inspection completed."
          echo "OrangeFox manifest and product port must be configured"
          echo "before a recovery image can be built."
